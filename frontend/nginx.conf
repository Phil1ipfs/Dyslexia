server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # SPA routing fallback — serves index.html for deep links like /admin/student-list
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: No /api/ proxy here on purpose. The React app calls the backend
    # directly at its absolute URL (https://api.literexia.com), so a same-origin
    # /api/ proxy is unnecessary — and the previous one pointed nginx back at
    # itself (proxy_pass http://localhost:8080/), which would loop. Removed.

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}

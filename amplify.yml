version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - PRE-BUILD ==="
        - echo "Working directory:" && pwd
        - echo "Checking frontend directory..."
        - ls -la frontend/
        - echo "Installing dependencies..."
        - npm --prefix frontend ci
        - echo "Dependencies installed successfully"
    build:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - BUILD ==="
        - echo "Verifying environment variables..."
        - echo "VITE_BACKEND_URL=$VITE_BACKEND_URL"
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
        - echo "VITE_API_URL=$VITE_API_URL"
        - echo "Building React application..."
        - npm --prefix frontend run build
        - echo "Build completed! Checking output..."
        - ls -la frontend/dist/
        - echo "Verifying _headers file was copied..."
        - ls -la frontend/dist/_headers
        - echo "First 20 lines of _headers file:"
        - head -20 frontend/dist/_headers
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo "Backend runs on separate EC2 server"
customHeaders:
  # OWASP ZAP Security Compliance - Apply to ALL paths
  - pattern: '**'
    headers:
      # OWASP ZAP Fix: Anti-clickjacking Header
      - key: 'X-Frame-Options'
        value: 'DENY'
      # OWASP ZAP Fix: X-Content-Type-Options Header
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      # OWASP ZAP Fix: Strict-Transport-Security (HSTS) Header
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      # XSS Protection
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      # Referrer Policy
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # Permissions Policy
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
      # OWASP ZAP Fix: Content Security Policy Header
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://literexia.com https://*.amazonaws.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://literexia.com https://*.amazonaws.com https://*.sentry.io https://*.ingest.us.sentry.io wss: ws:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
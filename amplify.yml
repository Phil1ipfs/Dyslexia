version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - PRE-BUILD ==="
        - echo "Working directory:" && pwd
        - echo "Checking frontend directory..."
        - ls -la frontend/
        - echo "Installing dependencies..."
        - npm --prefix frontend ci
        - echo "Dependencies installed successfully"
    build:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - BUILD ==="
        - echo "Verifying environment variables..."
        - echo "VITE_BACKEND_URL=$VITE_BACKEND_URL"
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
        - echo "VITE_API_URL=$VITE_API_URL"
        - echo "Building React application..."
        - npm --prefix frontend run build
        - echo "Build completed! Checking output..."
        - ls -la frontend/dist/
        - echo "Verifying _headers file..."
        - "ls -la frontend/dist/_headers && cat frontend/dist/_headers | head -20 || echo 'WARNING _headers file not found in dist'"
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo "Backend runs on separate EC2 server"
customHeaders:
  - pattern: '**/*'
    headers:
      # OWASP ZAP Fix: Anti-clickjacking Header (MEDIUM priority)
      - key: 'X-Frame-Options'
        value: 'DENY'
      # OWASP ZAP Fix: X-Content-Type-Options (LOW priority)
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      # XSS Protection
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      # OWASP ZAP Fix: Strict-Transport-Security (LOW priority)
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains; preload'
      # Referrer Policy
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # Permissions Policy
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
      # OWASP ZAP Fix: Content Security Policy (MEDIUM priority)
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.literexia.com https://*.sentry.io https://*.ingest.us.sentry.io https://*.amazonaws.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      # Cache Control for HTML (Informational fix)
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate, private'
      - key: 'Pragma'
        value: 'no-cache'
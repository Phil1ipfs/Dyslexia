version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - PRE-BUILD ==="
        - echo "Working directory:" && pwd
        - echo "Checking frontend directory..."
        - ls -la frontend/
        - echo "Installing dependencies..."
        - npm --prefix frontend ci
        - echo "Dependencies installed successfully"
    build:
      commands:
        - echo "=== LITEREXIA AMPLIFY BUILD - BUILD ==="
        - echo "Setting environment variables..."
        - export REACT_APP_API_URL=https://literexia-backend.com/api
        - export REACT_APP_BACKEND_URL=https://literexia-backend.com
        - export NODE_ENV=production
        - echo "Building React application..."
        - npm --prefix frontend run build
        - echo "Build completed! Checking output..."
        - ls -la frontend/dist/
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo "Backend runs on separate EC2 server"
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
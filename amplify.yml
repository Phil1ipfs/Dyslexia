version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== AWS AMPLIFY BUILD - PRE-BUILD PHASE ==="
        - echo "Working directory: $(pwd)"
        - echo "Repository contents:"
        - ls -la
        - echo "Frontend directory check:"
        - ls -la frontend/ || echo "Frontend directory not found"
        - echo "Installing dependencies with npm --prefix..."
        - npm --prefix frontend ci
        - echo "Dependencies installed successfully"
    build:
      commands:
        - echo "=== AWS AMPLIFY BUILD - BUILD PHASE ==="
        - echo "Working directory: $(pwd)"
        - echo "Current directory contents:"
        - ls -la
        - echo "Frontend directory contents:"
        - ls -la frontend/
        - echo "Building frontend application with npm --prefix..."
        - npm --prefix frontend run build
        - echo "Build completed successfully!"
        - echo "Checking build output in frontend/dist:"
        - ls -la frontend/dist/ || echo "Dist directory not found"
        - echo "Build artifacts ready for deployment"
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo "No backend build required - backend hosted on EC2"
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
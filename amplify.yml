version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Starting pre-build phase..."
        - echo "Current directory:"
        - pwd
        - echo "Listing root directory:"
        - ls -la
        - echo "Installing dependencies in frontend directory..."
        - npm ci --prefix frontend
    build:
      commands:
        - echo "Starting build phase..."
        - echo "Current working directory:"
        - pwd
        - echo "Listing current directory:"
        - ls -la
        - echo "Checking if frontend directory exists:"
        - test -d frontend && echo "frontend directory exists" || echo "frontend directory does not exist"
        - echo "Building from frontend directory..."
        - npm run build --prefix frontend
        - echo "Build completed!"
        - echo "Listing dist directory:"
        - ls -la frontend/dist/
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
backend:
  phases:
    build:
      commands:
        - echo "No backend build required - backend hosted on EC2"
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"